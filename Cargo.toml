[package]
name = "winlane"
version = "0.8.7"
edition = "2024"
description = "A native macOS window search and switcher"
license = "MIT"

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
global-hotkey = "0.8"
core-foundation = "0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
objc2-service-management = "0.3.2"
strsim = "0.11.1"
sha2 = "0.10"
rusqlite = { version = "0.37.0", default-features = false }
percent-encoding = "2.3.2"

[profile.release]
lto = "thin"
# Unstripped proc macros avoid the macOS 27 loader issue in rust-lang/rust#157750.
strip = "none"

[[test]]
name = "native_panels"
path = "tests/native_panels.rs"
harness = false
