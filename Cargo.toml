[package]
name = "winlane"
version = "0.2.11"
edition = "2024"
description = "A native macOS window search and switcher"
license = "MIT"

[dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
global-hotkey = "0.8"
core-foundation = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-service-management = "0.3.2"

[profile.release]
lto = "thin"
# Unstripped proc macros avoid the macOS 27 loader issue in rust-lang/rust#157750.
strip = "none"
